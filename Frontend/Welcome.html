<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome | FindBack</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .welcome-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 15% 15%, #d9f2ef 0, transparent 34%),
          linear-gradient(135deg, #f4f8fb, #eaf3f5);
      }
      .welcome-card {
        width: min(100%, 560px);
        padding: clamp(28px, 5vw, 48px);
        border: 1px solid #dce9ed;
        border-radius: 26px;
        background: #fff;
        box-shadow: 0 24px 70px rgba(16, 42, 67, 0.12);
        text-align: center;
      }
      .welcome-mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        border-radius: 22px;
        background: linear-gradient(135deg, #087e8b, #123b50);
        color: #fff;
        font-size: 34px;
      }
      .welcome-card h1 {
        margin: 0 0 12px;
        color: #102a43;
        font-size: clamp(1.7rem, 4vw, 2.35rem);
        letter-spacing: -0.04em;
      }
      .welcome-card p {
        color: #627d98;
        line-height: 1.7;
        margin: 0;
      }
      .welcome-code {
        display: none;
        margin: 22px 0;
        padding: 16px;
        border: 1px dashed #0b8793;
        border-radius: 14px;
        background: #f1faf9;
        color: #075b66;
        font-size: 1.25rem;
        font-weight: 800;
        letter-spacing: 0.12em;
      }
      .welcome-button {
        display: inline-flex;
        margin-top: 26px;
        padding: 13px 24px;
        border: 0;
        border-radius: 12px;
        background: #087e8b;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      .welcome-button:hover {
        background: #066875;
      }
    </style>
  </head>
  <body>
    <main class="welcome-shell">
      <section class="welcome-card">
        <div class="welcome-mark">✓</div>
        <h1 id="welcomeTitle">You're all set!</h1>
        <p id="welcomeMessage">
          Welcome to FindBack. Let's make lost things found again.
        </p>
        <div class="welcome-code" id="welcomeCode"></div>
        <a class="welcome-button" id="welcomeContinue" href="Login.html"
          >Continue</a
        >
      </section>
    </main>
    <script src="js/Welcome.js"></script>
  </body>
</html>
